# DiagForge - Mitigation Pattern Library (Starter Set)
#
# This file is the unique IP of DiagForge. Each pattern documents a recurring
# fault-handling strategy applied to false-positive or transient DTCs in
# production ECU software.
#
# License: CC-BY-4.0
#
# Format guidance:
# - Every pattern has a stable pattern_id (snake_case, used as foreign key)
# - when_applies: bullet list of observable conditions
# - parameters: tunable values with rules for suggesting initial values
# - verification: how to confirm the fix works (test bench / HIL / simulation)
# - standards: clauses or standards referenced (must be publicly verifiable)

schema_version: "1.0.0"

patterns:

  - pattern_id: "duration_qualified_debounce"
    name: "Duration-qualified debounce"
    short_description: >
      Require a signal to remain in the new state for a qualification time
      before accepting the transition. Filters out bouncing or transient
      noise on discrete inputs.
    when_applies:
      - "Discrete signal (e.g. ignition switch, door switch, brake switch) toggles multiple times within a short window"
      - "DTC fires on the first observed transition without any confirmation interval"
      - "Bounce/transition interval is shorter than typical signal sample period"
    parameters:
      - name: qualification_time_ms
        suggestion_rule: "max observed bounce interval x 2, rounded up to nearest 5ms; typical range 5-20ms"
        type: integer
      - name: confirmation_count
        suggestion_rule: "Default 1. Raise to 2 if noise persists across the qualification window."
        type: integer
    verification:
      - "Inject pulse shorter than qualification_time_ms; verify no DTC fires and no state transition is committed."
      - "Inject pulse equal to qualification_time_ms; verify state transitions exactly once and DTC behavior matches expectation."
      - "Inject pulse longer than qualification_time_ms; verify timely state transition without extra latency."
      - "Stress-test with random pulse trains; verify zero false transitions over 1000 cycles on bench."
    standards:
      - "ISO 14229-1:2020 11.3 (event qualification and fault confirmation)"
      - "ISO 26262-6:2018 9 (software unit verification - robustness against noise)"

  - pattern_id: "dematuration_timer"
    name: "Dematuration / fault-clear timer"
    short_description: >
      Require a fault condition to remain absent for a confirmed clear-time
      before the DTC is cleared. Prevents oscillating set/clear cycles on
      analog faults near a threshold.
    when_applies:
      - "Analog signal (voltage, current, temperature) qualifies and clears a fault repeatedly"
      - "Signal value is near the fault threshold with bounded noise"
      - "DTC count increments rapidly without an underlying root-cause change"
    parameters:
      - name: dematuration_time_ms
        suggestion_rule: "5x the dominant noise period observed near the threshold; typical 100-500ms"
        type: integer
      - name: clear_threshold_offset
        suggestion_rule: "Apply hysteresis: clear threshold should differ from set threshold by >= 2x peak noise amplitude"
        type: float
    verification:
      - "Hold signal at fault set-threshold for confirmation_time; verify DTC sets exactly once."
      - "Drop signal below clear_threshold for less than dematuration_time_ms; verify DTC does NOT clear."
      - "Drop signal below clear_threshold for >= dematuration_time_ms; verify DTC clears."
      - "Oscillate signal across threshold with bounded noise; verify no false set/clear cycling."
    standards:
      - "ISO 14229-1:2020 11.3 (status bit transitions and aging)"
      - "ISO 26262-6:2018 9 (defensive measures against transient faults)"

  - pattern_id: "retry_state_machine_nvm"
    name: "Retry state machine with NVM persistence"
    short_description: >
      Wrap NVM (EEPROM/Flash) read or write operations in a small state
      machine that retries on transient errors and persists state across
      power cycles, with a maximum retry count before declaring a hard fault.
    when_applies:
      - "DTC indicates data loss, checksum failure, or NVM read/write error"
      - "Fault is intermittent and correlates with power-cycle events"
      - "Single-attempt NVM access without retry logic"
    parameters:
      - name: max_retries
        suggestion_rule: "3 by default; 5 if NVM device datasheet specifies higher transient error rate"
        type: integer
      - name: retry_delay_ms
        suggestion_rule: ">= NVM tWR + 1ms; typical 5-20ms"
        type: integer
      - name: state_persistence_strategy
        suggestion_rule: "Store retry counter in dedicated NVM block; clear after successful operation"
        type: string
    verification:
      - "Inject single transient NVM error; verify successful retry and no DTC."
      - "Inject persistent NVM error; verify DTC after max_retries and graceful degradation."
      - "Power-cycle during a write; verify retry state recovers correctly and no data corruption."
      - "Stress: 1000 random power cycles during NVM operations; zero data loss."
    standards:
      - "ISO 26262-6:2018 9.4.3 (control flow and data flow analysis)"
      - "ISO 26262-5:2018 10 (HW-SW interfaces - non-volatile memory)"

  - pattern_id: "plausibility_check_redundant_signals"
    name: "Plausibility check across redundant signals"
    short_description: >
      Compare a signal against a redundant or related signal (e.g. switch
      state vs. sensor reading, or two redundant sensors). Set the DTC only
      when the disagreement persists and is outside expected tolerance.
    when_applies:
      - "DTC fires based on a single signal when a redundant or correlated signal is available"
      - "False positives occur on legitimate edge cases that one signal sees but the other doesn't"
      - "Sensor-vs-switch or sensor-vs-sensor architecture with no cross-check"
    parameters:
      - name: tolerance_window_ms
        suggestion_rule: "Larger than worst-case signal propagation delay; typical 20-100ms"
        type: integer
      - name: disagreement_threshold
        suggestion_rule: "Domain-specific. For boolean signals: 1 cycle. For analog: cover sensor tolerances + bus latency."
        type: float
    verification:
      - "Drive both signals to agreeing states; verify no DTC."
      - "Drive signals to disagreement within tolerance_window_ms; verify no DTC."
      - "Hold disagreement beyond tolerance_window_ms; verify DTC sets."
      - "Inject realistic sensor noise on one signal; verify no false DTC."
    standards:
      - "ISO 26262-9:2018 6 (analysis of dependent failures)"
      - "ISO 26262-5:2018 9 (hardware safety analysis)"

  - pattern_id: "boundary_condition_guard"
    name: "Boundary-condition guard / bounds enforcement"
    short_description: >
      Insert explicit range and array-bounds checks at input boundaries to
      catch off-by-one errors, out-of-range values, and array overflows that
      manifest as corrupted DTC data or spurious fault codes.
    when_applies:
      - "DTC fields contain implausible values (e.g. signal_id beyond defined range)"
      - "Fault data shows pattern consistent with buffer overrun or off-by-one"
      - "Defect found in coverage testing as array-OOB or boundary violation"
    parameters:
      - name: bounds_action
        suggestion_rule: "Clamp + log for non-safety-critical; clamp + DTC for safety-relevant; halt + safe-state for ASIL-D"
        type: string
      - name: assertion_strategy
        suggestion_rule: "Compile-time where possible (static_assert); runtime checks must be MISRA-clean"
        type: string
    verification:
      - "Inject input at lower bound - 1; verify guard catches it."
      - "Inject input at upper bound + 1; verify guard catches it."
      - "Inject input at exactly lower and upper bounds; verify both accepted."
      - "Run static analysis (cppcheck/MISRA addon, clang-tidy) - zero array-bounds warnings on the affected code."
      - "If unit tests exist, ensure coverage hits both bounds explicitly."
    standards:
      - "MISRA C:2025 Rule 18.1 (pointer arithmetic on arrays)"
      - "ISO 26262-6:2018 9.4.3 (defensive programming)"
      - "CWE-119 (improper restriction of operations within memory bounds)"

  - pattern_id: "communication_retry_state_machine"
    name: "Communication retry with timeout backoff"
    short_description: >
      Wait through a bounded number of missed publications before declaring a
      lost-communication DTC; clear only after a holdoff of clean reception.
      Eliminates U-codes caused by single-frame bus glitches.
    when_applies:
      - "DTC indicates lost communication with a specific source ECU (U0100, U0121, U0140 family)"
      - "Frames from the source ID disappear briefly (one to a few publish periods) and recover on their own"
      - "DTC count climbs without an underlying wiring or ECU power problem"
    parameters:
      - name: timeout_ms
        suggestion_rule: "3x the expected publish period of the source, capped at the system safety reaction budget"
        type: integer
      - name: max_consecutive_misses
        suggestion_rule: "Default 3; raise to 5 on noisy gateways, never below 2"
        type: integer
      - name: clear_holdoff_ms
        suggestion_rule: "5x expected publish period; minimum 200ms to prevent set/clear chatter"
        type: integer
    verification:
      - "Inject a single missing publication; verify no DTC fires and counter resets on recovery."
      - "Inject misses for timeout_ms + 1 publish periods; verify DTC sets exactly once."
      - "After DTC sets, restore publications; verify DTC clears only after clear_holdoff_ms of clean reception."
      - "Stress with bursty miss patterns (e.g. 1-on / 2-off / 1-on); verify no false sets."
    standards:
      - "ISO 14229-1:2020 11.3 (DTC qualification)"
      - "ISO 11898-1:2024 11 (CAN error handling)"
      - "SAE J1939-73 5.7 (J1939 diagnostic equivalents to U-codes)"

  - pattern_id: "oscillation_hysteresis"
    name: "Hysteresis-bounded oscillation guard"
    short_description: >
      Split a single fault threshold into separate set and clear thresholds
      with a band wide enough to swallow the observed noise. Stops a DTC
      from chattering when the signal oscillates near the limit.
    when_applies:
      - "Signal crosses a single set/clear threshold many times within a short window"
      - "DTC sets and clears repeatedly with no underlying state change"
      - "Pure dematuration_timer is insufficient because the oscillation period exceeds the dematuration time"
    parameters:
      - name: hysteresis_band
        suggestion_rule: "3x the observed peak-to-peak noise amplitude near the threshold"
        type: float
      - name: set_threshold
        suggestion_rule: "Keep the existing fault set point; the rework is on the clear side"
        type: float
      - name: clear_threshold
        suggestion_rule: "set_threshold - hysteresis_band (or + for clear-above-set semantics)"
        type: float
    verification:
      - "Sweep a slow ramp through both thresholds; verify exactly one set and one clear."
      - "Center bounded noise on the set threshold; verify zero set/clear cycles."
      - "Push signal across set then immediately back to just below set; verify DTC stays set."
      - "Push signal across clear; verify DTC clears."
    standards:
      - "ISO 14229-1:2020 11.3 (status bit transitions)"
      - "ISO 26262-6:2018 9 (defensive measures against transient faults)"

  - pattern_id: "signal_freshness_check"
    name: "Signal freshness / timeout check"
    short_description: >
      Track time-since-last-update for every received signal. Refuse stale
      values and declare unavailable if no update arrives within a bounded
      window. Critical for safety logic that reads cross-ECU signals.
    when_applies:
      - "DTC fires on stale or stuck signal value"
      - "Signal periodicity is known but the receiver uses last value without an age check"
      - "Cross-ECU received signal feeds safety logic without freshness gating"
    parameters:
      - name: max_age_ms
        suggestion_rule: "3x the expected publish period, capped at the safety reaction time budget"
        type: integer
      - name: stale_action
        suggestion_rule: "Use safe default + log; never feed a stale safety-critical value into actuation"
        type: string
      - name: freshness_counter_size
        suggestion_rule: "Wide enough to count max_age_ms / cycle_period without rolling over; usually 16-bit"
        type: integer
    verification:
      - "Stop publication from the source; verify subscriber flags stale after max_age_ms."
      - "Resume publication; verify staleness flag clears within one publish period."
      - "Confirm safety logic falls back to safe default while the signal is stale."
      - "Run with cycle period at maximum jitter; verify no false-stale events."
    standards:
      - "ISO 14229-1:2020 11.3 (DTC qualification)"
      - "ISO 26262-6:2018 7.4.13 (data freshness)"
      - "SAE J1939-21 5.4 (PGN broadcast timing requirements)"

  - pattern_id: "gradient_limit_check"
    name: "Gradient / rate-of-change limit"
    short_description: >
      Reject implausible single-sample jumps. Physical signals (temperature,
      pressure, vehicle speed) have bounded derivatives; a step beyond that
      bound usually means a sensor wire fault, ADC glitch, or message
      corruption, not a real physical change.
    when_applies:
      - "DTC indicates an implausible sensor reading"
      - "Signal physically cannot change as fast as the trace shows (e.g. coolant temp jumps 50C in 100ms)"
      - "Symptom is a single-sample spike followed by a return to the expected band"
    parameters:
      - name: max_gradient_per_s
        suggestion_rule: "Derived from the signal physics; document the source (e.g. coolant <= 5C/s under load)"
        type: float
      - name: violation_action
        suggestion_rule: "Clamp + count; if violation_count_for_dtc consecutive violations, flag sensor faulty"
        type: string
      - name: violation_count_for_dtc
        suggestion_rule: "Default 3; raise on signals with known burst noise"
        type: integer
    verification:
      - "Inject a step within max_gradient_per_s; verify accepted unchanged."
      - "Inject a single sample beyond max_gradient_per_s; verify clamped and no DTC."
      - "Inject violation_count_for_dtc consecutive over-gradient samples; verify DTC sets."
      - "Inject random ADC noise within physical bounds for 1000s; verify zero false flags."
    standards:
      - "ISO 26262-6:2018 9 (defensive programming)"
      - "ISO 11898-1:2024 11 (frame integrity)"

  - pattern_id: "cross_ecu_consensus"
    name: "Cross-ECU consensus / voting"
    short_description: >
      When the same signal is published by multiple ECUs (vehicle speed from
      ABS, transmission, gateway), vote across them instead of trusting any
      single source. Median for analog 3+, majority for boolean, throwout-
      extreme for 2.
    when_applies:
      - "Two or more ECUs publish a redundant version of the same signal"
      - "DTC fires because one source's reading disagrees with the others"
      - "Single-source plausibility check insufficient"
    parameters:
      - name: voting_strategy
        suggestion_rule: "median for analog with >=3 sources; majority for boolean; throwout-extreme for exactly 2 sources"
        type: string
      - name: disagreement_window_ms
        suggestion_rule: "2x the maximum publish period across the participating sources"
        type: integer
      - name: alert_threshold_count
        suggestion_rule: "K-out-of-N — typically 2-of-3 disagreements; tune to ASIL of the consumer"
        type: integer
    verification:
      - "All sources agree: verify no DTC and a single consensus value downstream."
      - "One source disagrees: verify it is excluded and consensus uses the rest."
      - "All sources disagree: verify DTC fires and a safe default is used."
      - "One source drops out entirely: verify graceful degradation to the remaining sources."
    standards:
      - "ISO 26262-9:2018 6 (dependent failure analysis)"
      - "ISO 26262-5:2018 9 (hardware safety analysis)"
      - "ISO 26262-6:2018 8.4.5 (software architectural design for redundancy)"
